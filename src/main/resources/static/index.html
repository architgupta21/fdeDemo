<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vortex AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --accent: #6d5bff;
      --accent-soft: #efedff;
      --accent-text: #ffffff;

      --bg: #f7f7f8;
      --surface: #ffffff;
      --surface-2: #f1f1f3;
      --text: #17171a;
      --text-muted: #6f6f76;
      --border: #e6e6e9;
      --input-bg: #ffffff;
      --shadow: rgba(20, 20, 25, 0.06);
      --scrollbar: rgba(20, 20, 25, 0.15);
      --ring: rgba(109, 91, 255, 0.18);
    }

    :root[data-theme="dark"] {
      --accent: #8b7bff;
      --accent-soft: #23213a;
      --accent-text: #ffffff;

      --bg: #0e0e10;
      --surface: #151517;
      --surface-2: #1c1c1f;
      --text: #f1f1f3;
      --text-muted: #94949c;
      --border: #26262a;
      --input-bg: #1a1a1d;
      --shadow: rgba(0, 0, 0, 0.4);
      --scrollbar: rgba(255, 255, 255, 0.15);
      --ring: rgba(139, 123, 255, 0.22);
    }

    @media (prefers-color-scheme: dark) {
      :root[data-theme="system"] {
        --accent: #8b7bff;
        --accent-soft: #23213a;
        --accent-text: #ffffff;

        --bg: #0e0e10;
        --surface: #151517;
        --surface-2: #1c1c1f;
        --text: #f1f1f3;
        --text-muted: #94949c;
        --border: #26262a;
        --input-bg: #1a1a1d;
        --shadow: rgba(0, 0, 0, 0.4);
        --scrollbar: rgba(255, 255, 255, 0.15);
        --ring: rgba(139, 123, 255, 0.22);
      }
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .chat-app {
      width: min(100%, 700px);
      height: min(760px, 92vh);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 20px 50px -20px var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    /* ---------- Header ---------- */

    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: var(--text);
    }

    .brand-mark svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    :root[data-theme="dark"] .brand-mark,
    :root[data-theme="system"] .brand-mark {
      background: var(--accent);
    }

    .brand-info h1 {
      font-size: 14.5px;
      font-weight: 600;
      letter-spacing: -0.1px;
      line-height: 1.3;
    }

    .brand-info p {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.3;
    }

    .header-actions {
      margin-left: auto;
    }

    .theme-switch {
      display: flex;
      align-items: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
    }

    .theme-switch button {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 999px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .theme-switch button svg {
      width: 15px;
      height: 15px;
    }

    .theme-switch button:hover {
      color: var(--text);
    }

    .theme-switch button.active {
      background: var(--surface);
      color: var(--accent);
      box-shadow: 0 1px 2px var(--shadow);
    }

    /* ---------- Messages ---------- */

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--scrollbar);
      border-radius: 10px;
    }

    .welcome {
      text-align: center;
      color: var(--text-muted);
      font-size: 11.5px;
      margin-bottom: 14px;
    }

    .message-row {
      display: flex;
      width: 100%;
      padding: 6px 0;
      animation: rise 0.18s ease;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .message {
      max-width: 76%;
      padding: 11px 15px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.55;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      background: var(--accent);
      color: var(--accent-text);
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      min-height: 20px;
      padding: 13px 15px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-3px); }
    }

    /* ---------- Composer ---------- */

    .composer {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .composer input {
      flex: 1;
      height: 44px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 14px;
      font-size: 14px;
      outline: none;
      background: var(--input-bg);
      color: var(--text);
      font-family: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .composer input::placeholder {
      color: var(--text-muted);
    }

    .composer input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }

    .composer button.send-btn {
      height: 44px;
      width: 44px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: var(--accent-text);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: opacity 0.15s ease, transform 0.15s ease;
      flex-shrink: 0;
    }

    .composer button.send-btn svg {
      width: 17px;
      height: 17px;
    }

    .composer button.send-btn:hover {
      opacity: 0.9;
    }

    .composer button.send-btn:active {
      transform: scale(0.96);
    }

    .composer button.send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    .message.error {
      background: #fdecec;
      color: #b3261e;
      border-color: #f6cfcf;
    }

    :root[data-theme="dark"] .message.error,
    :root[data-theme="system"] .message.error {
      background: #2a1616;
      color: #ff8a80;
      border-color: #3d1f1f;
    }

    @media (max-width: 640px) {
      body {
        padding: 0;
      }

      .chat-app {
        width: 100%;
        height: 100vh;
        border: none;
        border-radius: 0;
        box-shadow: none;
      }

      .message {
        max-width: 84%;
      }
    }
  </style>
</head>

<body>

  <div class="chat-app">

    <header class="header">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C7 2 4 5.5 4 10c0 3.2 2.1 5.2 4.3 6.1C10 16.8 11 15.7 11 14c0-1.4-1-1.9-1-3.2C10 8.8 11.3 7 13.5 7c2.6 0 4.5 2.2 4.5 5.2 0 5-4 8.8-9 8.8" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="brand-info">
        <h1>Vortex AI</h1>
        <p>Your customized AI companion</p>
      </div>

      <div class="header-actions">
        <div class="theme-switch" id="themeSwitch">
          <button type="button" data-theme-choice="light" title="Light" aria-label="Light mode">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
          <button type="button" data-theme-choice="dark" title="Dark" aria-label="Dark mode">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" data-theme-choice="system" title="System" aria-label="System theme">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="4.5" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.7"/><path d="M8 20h8M12 16.5V20" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="messages" id="messages">
      <div class="welcome">Today</div>

      <div class="message-row assistant">
        <div class="message assistant">
          Hi, I'm Vortex AI.<br>
          What can I help you with today?
        </div>
      </div>
    </main>

    <footer class="composer">
      <input
        id="messageInput"
        type="text"
        placeholder="Message Vortex AI..."
        autocomplete="off"
      />

      <button id="sendButton" class="send-btn" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </footer>

  </div>

  <script>
    const API_URL = "http://localhost:8080/api/chat";

    const messagesContainer = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const themeSwitch = document.getElementById("themeSwitch");
    const themeButtons = themeSwitch.querySelectorAll("button[data-theme-choice]");

    // ---- Theme handling: light / dark / system ----
    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);

      themeButtons.forEach(function (btn) {
        btn.classList.toggle("active", btn.dataset.themeChoice === theme);
      });

      try {
        localStorage.setItem("vortex-ai-theme", theme);
      } catch (e) {
        /* ignore storage errors */
      }
    }

    (function initTheme() {
      let saved = null;
      try {
        saved = localStorage.getItem("vortex-ai-theme");
      } catch (e) {
        /* ignore storage errors */
      }
      applyTheme(saved || "system");
    })();

    themeButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        applyTheme(btn.dataset.themeChoice);
      });
    });

    function addMessage(role, text, extraClass = "") {
      const row = document.createElement("div");
      row.className = `message-row ${role}`;

      const bubble = document.createElement("div");
      bubble.className = `message ${role} ${extraClass}`;
      bubble.textContent = text;

      row.appendChild(bubble);
      messagesContainer.appendChild(row);

      scrollToBottom();

      return row;
    }

    function showTyping() {
      const row = document.createElement("div");
      row.className = "message-row assistant";
      row.id = "typingIndicator";

      const bubble = document.createElement("div");
      bubble.className = "message assistant typing";

      bubble.innerHTML = `
        <span></span>
        <span></span>
        <span></span>
      `;

      row.appendChild(bubble);
      messagesContainer.appendChild(row);

      scrollToBottom();
    }

    function hideTyping() {
      const typing = document.getElementById("typingIndicator");

      if (typing) {
        typing.remove();
      }
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

  async function sendMessage() {

    const message = messageInput.value.trim();

    if (!message) {
        return;
    }

    addMessage("user", message);

    messageInput.value = "";
    messageInput.focus();

    sendButton.disabled = true;

    showTyping();

    let assistantRow = null;
    let assistantBubble = null;
    let hasStartedStreaming = false;

    try {

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain"
            },
            body: message
        });

        if (!response.ok) {
            throw new Error("Request failed");
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {

            const { value, done } = await reader.read();

            if (done) {
                break;
            }

            const chunk = decoder.decode(value, {
                stream: true
            });

            if (!hasStartedStreaming) {

                hideTyping();

                assistantRow = addMessage(
                    "assistant",
                    ""
                );

                assistantBubble =
                    assistantRow.querySelector(".message");

                hasStartedStreaming = true;
            }

            assistantBubble.textContent += chunk;

            scrollToBottom();
        }

        const remainingText = decoder.decode();

        if (remainingText && assistantBubble) {
            assistantBubble.textContent += remainingText;
        }

    } catch (error) {

        hideTyping();

        if (assistantRow) {
            assistantRow.remove();
        }

        addMessage(
            "assistant",
            "Sorry, I couldn't connect to Vortex AI. Please try again.",
            "error"
        );

    } finally {

        hideTyping();

        sendButton.disabled = false;
    }
  }

    sendButton.addEventListener("click", sendMessage);

    messageInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
